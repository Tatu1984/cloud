# =============================================================================
# ZT Bridge VM - Proxmox VE API Proxy Configuration
# =============================================================================
# This configuration handles proxying requests to Proxmox VE hosts
# through the ZeroTier network interface.
# =============================================================================

# Resolve Proxmox host IP from node name using map
# Add your Proxmox nodes here - these IPs are on the ZeroTier network
map $pve_node $pve_upstream {
    default         "";

    # Example mappings - update with your actual Proxmox nodes
    # Format: node-name  zerotier-ip:port;
    pve1            10.147.17.10:8006;
    pve2            10.147.17.11:8006;
    pve3            10.147.17.12:8006;

    # Add more nodes as needed:
    # node-name     zerotier-ip:port;
}

# Proxy configuration for PVE API requests
# This is included in the main server block

# Check if the node exists in our map
if ($pve_upstream = "") {
    return 404 '{"error": "Unknown Proxmox node: $pve_node"}';
}

# Proxy settings for Proxmox API
proxy_pass https://$pve_upstream/$pve_path$is_args$args;
proxy_http_version 1.1;

# SSL settings for upstream (Proxmox uses self-signed certs by default)
proxy_ssl_verify off;
proxy_ssl_server_name on;

# Headers
proxy_set_header Host $pve_upstream;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# WebSocket support for console access
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeout settings for long-running operations
proxy_connect_timeout 60s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# Buffer settings
proxy_buffering off;
proxy_request_buffering off;

# Pass through Proxmox authentication headers
proxy_pass_header Authorization;
proxy_pass_header Cookie;
proxy_pass_header CSRFPreventionToken;

# Rate limiting
limit_req zone=api_limit burst=100 nodelay;

# CORS headers for API access from web application
add_header Access-Control-Allow-Origin * always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, CSRFPreventionToken" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

# Handle preflight requests
if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, CSRFPreventionToken" always;
    add_header Access-Control-Max-Age 86400;
    add_header Content-Type 'text/plain charset=UTF-8';
    add_header Content-Length 0;
    return 204;
}
