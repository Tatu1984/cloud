# =============================================================================
# ZT Bridge VM - VNC Stream Proxy Configuration
# =============================================================================
# This file configures TCP proxying for VNC connections to VMs
# Add entries here for direct VNC access through the ZT Bridge
# =============================================================================

# Example VNC proxy configuration:
# Each VM that needs direct VNC access should have an entry here
#
# Format:
# upstream vnc_<vm-name> {
#     server <zerotier-ip>:<vnc-port>;
# }
#
# server {
#     listen <local-port>;
#     proxy_pass vnc_<vm-name>;
#     proxy_timeout 600s;
#     proxy_connect_timeout 10s;
# }

# Example: VM on ZeroTier IP 10.147.17.100 with VNC on port 5900
# Listen on local port 15900 and forward to the VM
#
# upstream vnc_vm_web_server {
#     server 10.147.17.100:5900;
# }
#
# server {
#     listen 15900;
#     proxy_pass vnc_vm_web_server;
#     proxy_timeout 600s;
#     proxy_connect_timeout 10s;
# }

# Note: For most use cases, using Guacamole for VNC access is recommended
# as it provides a browser-based interface without requiring VNC clients.
# Direct VNC proxying is useful for advanced users who prefer native clients.
