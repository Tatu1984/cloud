# =============================================================================
# ZT Bridge VM - Default Server Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Upstream Definitions
# -----------------------------------------------------------------------------

# Guacamole web application
upstream guacamole {
    server guacamole:8080;
    keepalive 32;
}

# Zero-UI web interface
upstream zero-ui {
    server zero-ui:4000;
    keepalive 16;
}

# MDC WebAPI Backend
upstream mdc-api {
    server mdc-api:8080;
    keepalive 32;
}

# MDC Frontend
upstream mdc-frontend {
    server frontend:3000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP Server (Redirect to HTTPS when SSL is enabled)
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health check endpoint (always available)
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # For Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Main location block - proxy to MDC Frontend
    location / {
        # Uncomment the following line to redirect to HTTPS when SSL is enabled
        # return 301 https://$host$request_uri;

        # Proxy to MDC Frontend (Next.js)
        proxy_pass http://mdc-frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Guacamole console access
    location /guacamole/ {
        proxy_pass http://guacamole/guacamole/;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;

        # Rate limiting
        limit_req zone=console_limit burst=20 nodelay;
    }

    # Zero-UI interface
    location /zero-ui/ {
        proxy_pass http://zero-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # PVE API proxy - routes to Proxmox hosts via ZeroTier
    # Format: /pve/{node-name}/api2/json/...
    location ~ ^/pve/([^/]+)/(.*)$ {
        # Resolve the Proxmox host dynamically
        # This requires nginx compiled with --with-http_realip_module
        set $pve_node $1;
        set $pve_path $2;

        # Include the PVE proxy configuration
        include /etc/nginx/conf.d/pve-proxy.conf;
    }

    # OData API endpoint for MDC WebAPI
    location /odata/ {
        proxy_pass http://mdc-api/odata/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # OData batch operations can be large
        client_max_body_size 10M;
        proxy_read_timeout 300s;

        # Rate limiting for API
        limit_req zone=api_limit burst=100 nodelay;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }
    }

    # Swagger/OpenAPI documentation
    location /swagger {
        proxy_pass http://mdc-api/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scalar API documentation
    location /scalar {
        proxy_pass http://mdc-api/scalar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI spec
    location /openapi {
        proxy_pass http://mdc-api/openapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API endpoint for MDC Web Application (legacy/internal)
    location /api/ {
        proxy_pass http://mdc-api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Rate limiting for API
        limit_req zone=api_limit burst=50 nodelay;
    }
}

