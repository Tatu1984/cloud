version: '3.8'

# =============================================================================
# ZT Bridge VM - Docker Compose Configuration
# =============================================================================
# This stack provides the central hub for MDC platform connectivity:
# - PostgreSQL: Database for Guacamole and zero-ui
# - nginx: Reverse proxy for PVE API routing through ZeroTier
# - guacd: Apache Guacamole daemon for browser-based VM console
# - guacamole: Apache Guacamole web application
# - zero-ui: ZeroTier network management interface
# - zerotier: ZeroTier client for VPN connectivity
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: zt-bridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ztbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ztbridge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - zt-bridge-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ztbridge} -d ${POSTGRES_DB:-ztbridge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # ZeroTier Client
  # ===========================================================================
  zerotier:
    image: zerotier/zerotier:latest
    container_name: zt-bridge-zerotier
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - zerotier_data:/var/lib/zerotier-one
      - ./zerotier/entrypoint.sh:/entrypoint.sh:ro
    environment:
      ZEROTIER_NETWORK_IDS: ${ZEROTIER_NETWORK_IDS:-}
    entrypoint: /entrypoint.sh

  # ===========================================================================
  # Zero-UI (ZeroTier Controller Web Interface)
  # ===========================================================================
  zero-ui:
    image: dec0dos/zero-ui:latest
    container_name: zt-bridge-zero-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Zero-UI Configuration
      ZU_CONTROLLER_ENDPOINT: ${ZU_CONTROLLER_ENDPOINT:-http://localhost:9993}
      ZU_SECURE_HEADERS: "true"
      ZU_DEFAULT_USERNAME: ${ZERO_UI_USERNAME:-admin}
      ZU_DEFAULT_PASSWORD: ${ZERO_UI_PASSWORD:?ZERO_UI_PASSWORD is required}
      # Database Configuration (PostgreSQL)
      ZU_CONTROLLER_DATABASE: postgres
      ZU_POSTGRES_HOST: postgres
      ZU_POSTGRES_PORT: 5432
      ZU_POSTGRES_USER: ${POSTGRES_USER:-ztbridge}
      ZU_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZU_POSTGRES_DB: zero_ui
    volumes:
      - zero_ui_data:/app/backend/data
    networks:
      - zt-bridge-internal
    ports:
      - "${ZERO_UI_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Apache Guacamole Daemon (guacd)
  # ===========================================================================
  guacd:
    image: guacamole/guacd:latest
    container_name: zt-bridge-guacd
    restart: unless-stopped
    networks:
      - zt-bridge-internal
    volumes:
      - guacd_drive:/drive:rw
      - guacd_record:/record:rw
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Apache Guacamole Web Application
  # ===========================================================================
  guacamole:
    image: guacamole/guacamole:latest
    container_name: zt-bridge-guacamole
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_healthy
    environment:
      # Guacd connection
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      # PostgreSQL connection
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: guacamole
      POSTGRES_USER: ${POSTGRES_USER:-ztbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Optional: LDAP/SAML configuration can be added here
      # LDAP_HOSTNAME: ldap.example.com
      # LDAP_PORT: 389
    volumes:
      - ./guacamole/guacamole-home:/guacamole-home:ro
      - ./guacamole/extensions:/opt/guacamole/extensions:ro
    networks:
      - zt-bridge-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/guacamole/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: zt-bridge-nginx
    restart: unless-stopped
    depends_on:
      - guacamole
      - zero-ui
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - zt-bridge-internal
    # Use host network for ZeroTier interface access
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# Networks
# =============================================================================
networks:
  zt-bridge-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  zerotier_data:
    driver: local
  zero_ui_data:
    driver: local
  guacd_drive:
    driver: local
  guacd_record:
    driver: local
  nginx_cache:
    driver: local
