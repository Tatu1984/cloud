# =============================================================================
# Apache Guacamole Configuration
# =============================================================================
# This file configures the Guacamole web application
# Copy to guacamole-home/guacamole.properties
# =============================================================================

# Guacd connection
guacd-hostname: guacd
guacd-port: 4822

# PostgreSQL authentication
postgresql-hostname: postgres
postgresql-port: 5432
postgresql-database: guacamole
postgresql-username: ${POSTGRES_USER}
postgresql-password: ${POSTGRES_PASSWORD}

# API endpoint configuration
api-session-timeout: 60

# Enable WebSocket tunneling for better performance
enable-websocket: true

# Recording settings
recording-path: /record
recording-include-keys: true

# Drive settings for file transfer
enable-drive: true
drive-path: /drive

# Security settings
allowed-languages: en, es, de, fr

# Skip if connection fails
skip-if-unavailable: false
