trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: roger-mdc-backend-vars
  - name: GO_VERSION
    value: '1.21'
  - name: BINARY_NAME
    value: 'api'

stages:
  # ============================================
  # STAGE 1: Build and Test
  # ============================================
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildJob
        displayName: 'Build Go Application'
        steps:
          # Install Go
          - task: GoTool@0
            displayName: 'Install Go $(GO_VERSION)'
            inputs:
              version: '$(GO_VERSION)'

          # Download dependencies
          - script: |
              go mod download
              go mod verify
            displayName: 'Download dependencies'
            workingDirectory: '$(Build.SourcesDirectory)'

          # Run tests
          - script: |
              go test -v -race -coverprofile=coverage.out ./...
            displayName: 'Run tests'
            workingDirectory: '$(Build.SourcesDirectory)'
            continueOnError: true

          # Build the application
          - script: |
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o $(Build.ArtifactStagingDirectory)/$(BINARY_NAME) ./cmd/api
            displayName: 'Build binary'
            workingDirectory: '$(Build.SourcesDirectory)'

          # Copy necessary files
          - script: |
              cp Dockerfile $(Build.ArtifactStagingDirectory)/
              cp -r prometheus.yml $(Build.ArtifactStagingDirectory)/ 2>/dev/null || true
            displayName: 'Copy deployment files'
            workingDirectory: '$(Build.SourcesDirectory)'

          # Publish artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'backend-drop'
              publishLocation: 'Container'

  # ============================================
  # STAGE 2: Deploy to Azure App Service
  # ============================================
  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to App Service'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                # Download artifact
                - download: current
                  artifact: backend-drop

                # Deploy to Azure App Service
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    appType: 'webAppLinux'
                    appName: '$(AZURE_WEBAPP_NAME)'
                    package: '$(Pipeline.Workspace)/backend-drop/$(BINARY_NAME)'
                    runtimeStack: 'GO|1.21'

                # Health check
                - script: |
                    echo "Waiting for deployment to stabilize..."
                    sleep 30
                    curl -f https://$(AZURE_WEBAPP_NAME).azurewebsites.net/health || echo "Health check endpoint not available"
                  displayName: 'Health check'
                  continueOnError: true
