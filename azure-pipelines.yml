# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '67e2ff83-f116-43e6-83a1-fcf924ea5ef8'
  imageRepository: 'mdcwebdashboardpreview'
  containerRegistry: 'microdatacenterdevelopment.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/frontend/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    # Build the Docker image with build args
    - script: |
        docker build \
          --build-arg NEXT_PUBLIC_ENTRA_CLIENT_ID="$(NEXT_PUBLIC_ENTRA_CLIENT_ID)" \
          --build-arg NEXT_PUBLIC_ENTRA_TENANT_ID="$(NEXT_PUBLIC_ENTRA_TENANT_ID)" \
          --build-arg NEXT_PUBLIC_ENTRA_AUTHORITY="$(NEXT_PUBLIC_ENTRA_AUTHORITY)" \
          --build-arg NEXT_PUBLIC_ENTRA_REDIRECT_URI="$(NEXT_PUBLIC_ENTRA_REDIRECT_URI)" \
          --build-arg NEXT_PUBLIC_API_URL="$(NEXT_PUBLIC_API_URL)" \
          -t $(containerRegistry)/$(imageRepository):$(tag) \
          -t $(containerRegistry)/$(imageRepository):latest \
          -f $(dockerfilePath) \
          $(Build.SourcesDirectory)/frontend
      displayName: Build Docker image

    # Login to ACR
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    # Push the Docker image
    - script: |
        docker push $(containerRegistry)/$(imageRepository):$(tag)
        docker push $(containerRegistry)/$(imageRepository):latest
      displayName: Push Docker image

    # Force App Service to pull new image
    - task: AzureCLI@2
      displayName: Restart App Service
      inputs:
        azureSubscription: 'microdatacenterdevelopment'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az webapp restart --name mdc-web-dashboard-preview --resource-group MicroDataCenterDevelopment
